[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recap"
version = "0.1.0"
description = "Contract-based guardrails for ReAct agents"
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "pydantic>=2,<3",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "python-dotenv",
    "blake3",
    "orjson",
    "z3-solver>=4.13,<5",
    "asyncpg>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["recap*"]
